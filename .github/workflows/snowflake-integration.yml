name: Snowflake Integration (Manual)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Executar dbt contra Snowflake real? Pode consumir creditos."
        required: true
        type: choice
        default: "no"
        options: ["no", "yes"]

permissions:
  contents: read

concurrency:
  group: snowflake-integration
  cancel-in-progress: false

jobs:
  integration:
    if: ${{ inputs.confirm == 'yes' }}
    name: dbt seed/run/snapshot/test (key pair)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DBT_SNOWFLAKE_ACCOUNT: ${{ secrets.DBT_SNOWFLAKE_ACCOUNT }}
      DBT_SNOWFLAKE_USER: ${{ secrets.DBT_SNOWFLAKE_USER }}
      DBT_SNOWFLAKE_PRIVATE_KEY: ${{ secrets.DBT_SNOWFLAKE_PRIVATE_KEY }}
      DBT_SNOWFLAKE_PRIVATE_KEY_PASSPHRASE: ${{ secrets.DBT_SNOWFLAKE_PRIVATE_KEY_PASSPHRASE }}
      DBT_SNOWFLAKE_ROLE: ${{ secrets.DBT_SNOWFLAKE_ROLE }}
      DBT_SNOWFLAKE_DATABASE: ${{ secrets.DBT_SNOWFLAKE_DATABASE }}
      DBT_SNOWFLAKE_WAREHOUSE: ${{ secrets.DBT_SNOWFLAKE_WAREHOUSE }}
      DBT_SNOWFLAKE_SCHEMA: ${{ secrets.DBT_SNOWFLAKE_SCHEMA }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Validate dedicated Snowflake configuration
        shell: bash
        run: |
          for key in DBT_SNOWFLAKE_ACCOUNT DBT_SNOWFLAKE_USER DBT_SNOWFLAKE_PRIVATE_KEY DBT_SNOWFLAKE_PRIVATE_KEY_PASSPHRASE DBT_SNOWFLAKE_ROLE DBT_SNOWFLAKE_DATABASE DBT_SNOWFLAKE_WAREHOUSE DBT_SNOWFLAKE_SCHEMA; do
            if [ -z "${!key}" ]; then
              echo "::error::Configure repository secret $key before dispatch."
              exit 1
            fi
          done
          if [ "$DBT_SNOWFLAKE_SCHEMA" = "PUBLIC" ]; then
            echo "::error::Use a dedicated schema, not PUBLIC."
            exit 1
          fi

      - name: Prepare private key file (encrypted PKCS8)
        shell: bash
        run: |
          umask 077
          key_file="${RUNNER_TEMP}/dbt_snowflake_key.p8"
          printf '%s\n' "$DBT_SNOWFLAKE_PRIVATE_KEY" > "$key_file"
          chmod 600 "$key_file"
          echo "DBT_SNOWFLAKE_PRIVATE_KEY_PATH=$key_file" >> "$GITHUB_ENV"

      - name: Install dbt
        run: python -m pip install -r requirements.txt

      - name: Prepare ignored dbt profile
        run: cp profiles.yml.example profiles.yml

      - name: Check Snowflake connection
        run: dbt debug --profiles-dir .

      - name: Load synthetic seeds
        run: dbt seed --profiles-dir .

      - name: Build staging, intermediate and marts
        run: dbt run --profiles-dir .

      - name: Snapshot mutable customers
        run: dbt snapshot --profiles-dir .

      - name: Run generic and SQL reconciliation tests
        run: dbt test --profiles-dir .
