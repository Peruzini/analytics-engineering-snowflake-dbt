name: Snowflake Integration (Manual Self-Hosted)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Executar dbt contra Snowflake real? Pode consumir creditos."
        required: true
        type: choice
        default: "no"
        options: ["no", "yes"]

permissions:
  contents: read

concurrency:
  group: snowflake-integration
  cancel-in-progress: false

jobs:
  integration:
    if: ${{ inputs.confirm == 'yes' }}
    runs-on: [self-hosted, Windows, X64, ae-local]
    timeout-minutes: 40
    env:
      DBT_SNOWFLAKE_ACCOUNT: ${{ secrets.DBT_SNOWFLAKE_ACCOUNT }}
      DBT_SNOWFLAKE_USER: ${{ secrets.DBT_SNOWFLAKE_USER }}
      DBT_SNOWFLAKE_PRIVATE_KEY: ${{ secrets.DBT_SNOWFLAKE_PRIVATE_KEY }}
      DBT_SNOWFLAKE_PRIVATE_KEY_PASSPHRASE: ${{ secrets.DBT_SNOWFLAKE_PRIVATE_KEY_PASSPHRASE }}
      DBT_SNOWFLAKE_ROLE: ${{ secrets.DBT_SNOWFLAKE_ROLE }}
      DBT_SNOWFLAKE_DATABASE: ${{ secrets.DBT_SNOWFLAKE_DATABASE }}
      DBT_SNOWFLAKE_WAREHOUSE: ${{ secrets.DBT_SNOWFLAKE_WAREHOUSE }}
      DBT_SNOWFLAKE_SCHEMA: ${{ secrets.DBT_SNOWFLAKE_SCHEMA }}
    steps:
      - uses: actions/checkout@v4
      - name: Check configuration without Snowflake access
        shell: powershell
        run: |
          foreach ($name in @('DBT_SNOWFLAKE_ACCOUNT','DBT_SNOWFLAKE_USER','DBT_SNOWFLAKE_PRIVATE_KEY',
                              'DBT_SNOWFLAKE_PRIVATE_KEY_PASSPHRASE','DBT_SNOWFLAKE_ROLE',
                              'DBT_SNOWFLAKE_DATABASE','DBT_SNOWFLAKE_WAREHOUSE','DBT_SNOWFLAKE_SCHEMA')) {
            if (-not [Environment]::GetEnvironmentVariable($name)) { throw "Missing secret: $name" }
          }
          if ($env:DBT_SNOWFLAKE_SCHEMA -eq 'PUBLIC') { throw 'Use dedicated schema.' }
      - name: Prepare temporary private key
        shell: powershell
        run: |
          $keyFile = Join-Path $env:RUNNER_TEMP 'dbt_snowflake_key.p8'
          [System.IO.File]::WriteAllText($keyFile,
            ($env:DBT_SNOWFLAKE_PRIVATE_KEY + [Environment]::NewLine),
            (New-Object System.Text.UTF8Encoding($false)))
          "DBT_SNOWFLAKE_PRIVATE_KEY_PATH=$keyFile" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Prepare ignored profile
        shell: powershell
        run: Copy-Item profiles.yml.example profiles.yml
      - name: Check Snowflake connection
        shell: powershell
        run: dbt debug --profiles-dir .
      - name: Load data
        shell: powershell
        run: dbt seed --profiles-dir .
      - name: Build models
        shell: powershell
        run: dbt run --profiles-dir .
      - name: Snapshot
        shell: powershell
        run: dbt snapshot --profiles-dir .
      - name: Test
        shell: powershell
        run: dbt test --profiles-dir .
      - name: Remove key and ignored profile
        if: always()
        shell: powershell
        run: |
          Remove-Item (Join-Path $env:RUNNER_TEMP 'dbt_snowflake_key.p8') -Force -ErrorAction SilentlyContinue
          Remove-Item profiles.yml -Force -ErrorAction SilentlyContinue
