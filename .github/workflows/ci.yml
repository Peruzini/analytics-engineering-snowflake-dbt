name: Analytics Engineering Local CI (Manual)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ae-local-ci
  cancel-in-progress: false

jobs:
  quality:
    name: Offline dbt and DuckDB on PC
    runs-on: [self-hosted, Windows, X64, ae-local]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Run installed local gates
        shell: powershell
        run: python scripts/local_ci.py --full
