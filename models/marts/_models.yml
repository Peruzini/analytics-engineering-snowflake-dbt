version: 2

models:
  - name: dim_customers
    description: "Dimensão de clientes. Grão: customer_id."
    columns:
      - name: customer_id
        data_tests: [not_null, unique]
      - name: email
        data_tests: [not_null]

  - name: dim_products
    description: "Dimensão de produtos. Grão: product_id."
    columns:
      - name: product_id
        data_tests: [not_null, unique]

  - name: fct_orders
    description: "Fato com todos os pedidos; grão order_id."
    columns:
      - name: order_id
        data_tests: [not_null, unique]
      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_customers')
              field: customer_id
      - name: campaign_id
        data_tests:
          - relationships:
              to: ref('stg_campaigns')
              field: campaign_id
      - name: channel
        description: "Canal atribuído via campanha, ou unattributed sem campanha; grão do pedido."
        data_tests:
          - not_null
          - accepted_values:
              values: ['organic', 'paid_search', 'social', 'email', 'unattributed']
      - name: order_date
        data_tests: [not_null]
      - name: order_status
        data_tests:
          - accepted_values:
              values: ['completed', 'cancelled', 'pending', 'refunded']
      - name: recognized_revenue
        data_tests: [not_null]

  - name: fct_order_items
    description: "Fato de itens; grão order_item_id, sem multiplicar pagamentos."
    columns:
      - name: order_item_id
        data_tests: [not_null, unique]
      - name: order_id
        data_tests:
          - not_null
          - relationships:
              to: ref('fct_orders')
              field: order_id
      - name: product_id
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_products')
              field: product_id
      - name: customer_id
        data_tests: [not_null]
      - name: recognized_item_revenue
        data_tests: [not_null]

  - name: mart_daily_sales
    description: "Grão dia com pedidos; receita apenas de completed."
    columns:
      - name: order_date
        data_tests: [not_null, unique]
      - name: order_count
        data_tests: [not_null]
      - name: recognized_revenue
        data_tests: [not_null]

  - name: mart_customer_ltv
    description: "Grão cliente; LTV observada, sem previsão."
    columns:
      - name: customer_id
        data_tests:
          - not_null
          - unique
          - relationships:
              to: ref('dim_customers')
              field: customer_id
      - name: lifetime_recognized_revenue
        data_tests: [not_null]

  - name: mart_channel_performance
    description: "Grão canal, incluindo unattributed; verba é planejada, não gasto."
    columns:
      - name: channel
        data_tests:
          - not_null
          - unique
          - accepted_values:
              values: ['organic', 'paid_search', 'social', 'email', 'unattributed']
      - name: order_count
        data_tests: [not_null]
      - name: recognized_revenue
        data_tests: [not_null]
